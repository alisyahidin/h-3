title: Our Works
description: Hakuhodo is one of the most highly decorated agencies in the world
  for creative work. Unique among Asian-based agencies, we have twice won the
  Cannes Grand Prix and were awarded a Special Lion commemorating Cannes Lions’
  50th anniversary. A selection of our recent creative work that has received
  top awards at major international advertising competitions is shown here.
