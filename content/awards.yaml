title: Awards
description: By empowering strong local talents, we invests in significant
  resources to make H:Three standout among other agencies. Here are some of the
  ways in which we are proud to be recognised and awarded.
awards:
  - collapsed: false
    description: "Jakarta is a city with millions of motorcycles, where motorcycle
      taxis, online and offline, become an essential part of our life. Sadly,
      many still don’t care about safety. Therefore Grab, would like to change
      that by becoming the pioneer of online motorcycle taxis that provide
      safety riding. And to catch people’s attention, a number of popular celebs
      became unexpected Grab bike drivers, creating social media buzz towards
      #PilihAman (choose safe)"
    title: "Digital Integrated Campaign: Bronze"
    thumbnail: /images/Award 1 - cp2017.jpg
    picture: /images/Award 1 - cp2017.jpg
    slug: "Citra Pariwara 2017  #PilihAman Grab Bike Corporate Campaign Grab
      Indonesia"
  - collapsed: false
    description: The first ever test drive that comes with an amusement park was
      created, titled Mitsubishi Xpander Tons of Real Happiness. An on-ground
      activity that started with demonstration of Mitsubishi Xpander’s strength
      towing 24 tons of weight in the form of a carousel. The iconic act marked
      the beginning of integrated marketing campaign with various medium; ATL,
      BTL, digital, direct promotion and customer experience, lifted Xpander’s
      brand image among ultra-competitive market.
    title: "Best use of Integrated Media: Silver"
    thumbnail: /images/Award 2 3 - Citra Pariwara 2019.png
    picture: /images/Award 2 3 - Citra Pariwara 2019.png
    slug: Citra Pariwara 2019 Tons of Real Happiness Mitsubishi Xpander PT
