- name: page
  label: Pages
  files:
  - name: landingpage
    label: Landing Page
    file: content/landing-page.yaml
    fields:
    - name: our-people
      label: Our People
      widget: list
      fields:
      - { name: name, label: Name, widget: string }
      - { name: avatar, label: Avatar, widget: image }
      - { name: position, label: Position, widget: string }
      - { name: company, label: Company, widget: string }
      - { name: description, label: Description, widget: text }
  - name: our-work
    label: Our Works
    file: content/our-work.yaml
    fields:
    - { name: title, label: Title, widget: string }
    - { name: description, label: Description, widget: text }
    - name: works
      label: List Works
      widget: list
      fields:
      - { name: title, label: Title, widget: string }
      - { name: category, label: Category, widget: select, options: [ All, Branding, Web, Development, Films ] }
      - { name: thumbnail, label: Thumbnail, widget: image }
      - { name: slug, label: Slug, widget: string }
      - { name: description, label: Description, widget: markdown }
  - name: awards
    label: Awards
    file: content/awards.yaml
    fields:
    - { name: title, label: Title, widget: string }
    - { name: description, label: Description, widget: text }
    - name: awards
      label: List awards
      widget: list
      fields:
      - { name: title, label: Title, widget: string }
      - { name: thumbnail, label: Thumbnail, widget: image }
      - { name: picture, label: Picture, widget: image }
      - { name: slug, label: Slug, widget: string }
      - { name: description, label: Description, widget: markdown }
- name: footer
  label: Footer
  files:
  - name: social-media
    label: Social Media
    file: content/landing-page.yaml
    fields:
    - name: social-media
      label: Social Media
      widget: list
      fields:
      - { name: name, label: Name, widget: select, options: [ instagram, facebook, twitter ] }
      - { name: link, label: Link, widget: string }